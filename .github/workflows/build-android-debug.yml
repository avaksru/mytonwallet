name: Build Android Debug APK

on:
  push:
   branches:
    - master
  workflow_dispatch:
    inputs:
      brand:
        description: App brand flavor
        required: true
        type: choice
        default: mytonwallet
        options:
          - mytonwallet
          - gram
      env:
        description: Environment flavor
        required: true
        type: choice
        default: prod
        options:
          - prod
          - beta
      build_type:
        description: APK build type
        required: true
        type: choice
        default: debug
        options:
          - debug
          - release

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      STAKING_POOLS: ${{ vars.STAKING_POOLS }}
      PUBLISH_REPO: ${{ vars.PUBLISH_REPO }}
      BRILLIANT_API_BASE_URL: ${{ vars.BRILLIANT_API_BASE_URL }}
      SWAP_FEE_ADDRESS: ${{ vars.SWAP_FEE_ADDRESS }}
      DIESEL_ADDRESS: ${{ vars.DIESEL_ADDRESS }}
      AGENT_API_URL: ${{ vars.AGENT_API_URL }}
      APP_BRAND: ${{ github.event.inputs.brand }}
      APP_ENV: ${{ github.event.inputs.env }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare the Node environment
        uses: mytonwallet-org/shared-actions/prepare_node@master
        with:
          node-version: ${{ vars.NODE_VERSION }}

      - name: Build mobile SDK
        run: |
          npm run i18n:build:android
          npm run mobile:build:sdk

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x mobile/android/gradlew

      # Release APKs must be signed or Android refuses to install them with
      # "package invalid/corrupted". The debug workflow does not use the release
      # signing secrets, so we sign release builds with the standard Android
      # debug keystore. This keeps artifacts installable for testing while
      # leaving production fastlane builds untouched.
      - name: Prepare release signing keystore
        if: github.event.inputs.build_type == 'release'
        run: |
          KEYSTORE_DIR="$HOME/.android"
          KEYSTORE_FILE="$KEYSTORE_DIR/debug.keystore"
          mkdir -p "$KEYSTORE_DIR"
          if [ ! -f "$KEYSTORE_FILE" ]; then
            keytool -genkey \
              -v \
              -keystore "$KEYSTORE_FILE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build APK
        run: |
          cd mobile/android
          BRAND_CAP=$(printf '%s' "$APP_BRAND" | awk '{print toupper(substr($0,1,1)) substr($0,2)}')
          ENV_CAP=$(printf '%s' "$APP_ENV" | awk '{print toupper(substr($0,1,1)) substr($0,2)}')
          TYPE_CAP=$(printf '%s' "${{ github.event.inputs.build_type }}" | awk '{print toupper(substr($0,1,1)) substr($0,2)}')
          echo "Building assemble${BRAND_CAP}${ENV_CAP}${TYPE_CAP}"
          if [ "${{ github.event.inputs.build_type }}" == "release" ]; then
            ./gradlew "assemble${BRAND_CAP}${ENV_CAP}${TYPE_CAP}" \
              -Pandroid.injected.signing.store.file="$HOME/.android/debug.keystore" \
              -Pandroid.injected.signing.store.password=android \
              -Pandroid.injected.signing.key.alias=androiddebugkey \
              -Pandroid.injected.signing.key.password=android
          else
            ./gradlew "assemble${BRAND_CAP}${ENV_CAP}${TYPE_CAP}"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.brand }}-${{ github.event.inputs.env }}-${{ github.event.inputs.build_type }}-apk
          path: mobile/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
